name: Windows
on:
  workflow_dispatch:
  push:
    tags: ['build*']
permissions:
  contents: write
jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: chmod +x scripts/build-windows.sh && ./scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: dist/*
          if-no-files-found: warn
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'build' }}
          name: Alg0rithm packages
          body: |
            Native packages for Alg0rithm.

            Install (Linux):
            ```bash
            curl -fsSL https://api.alg0rithm.dev/install.sh | bash
            ```

            API: https://api.alg0rithm.dev/
          files: dist/*
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
