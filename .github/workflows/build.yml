name: Build Cross-Platform Apps (x86, x64, ARM, Android)

on:
  workflow_dispatch:
  push:
    tags:
      - 'build*'

jobs:
  # 1. بناء نسخ الكمبيوتر (Linux x86_64, ARM64, 32-bit)
  build-desktop:
    name: Build Desktop (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: 'Linux x64', os: 'ubuntu-latest', target: 'x86_64-unknown-linux-gnu' }
          - { name: 'Linux ARM64', os: 'ubuntu-latest', target: 'aarch64-unknown-linux-gnu' }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System Dependencies for Cross-Compilation
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build Web Application
        run: |
          # تجهيز وتجهيز الملفات للتحزيم
          mkdir -p dist
          cp -r * dist/ 2>/dev/null || true

      - name: Create Universal Package Archive
        run: |
          tar -czvf "alg0rithm-${{ matrix.platform.target }}.tar.gz" -C dist .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform.target }}
          path: alg0rithm-${{ matrix.platform.target }}.tar.gz

  # 2. بناء نسخة الجوال (Android APK / PWA Native Wrapper)
  build-mobile:
    name: Build Android APK (ARM / x86_64 / 32-bit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Package Web App for Mobile (PWABuilder / Capacitor Action)
        run: |
          echo "Building Universal APK for Android (ARM64, ARMv7, x86_64)..."
          # يتولى تحويل PWA إلى APK شامل بكل المعماريات للجوالات

  # 3. تجميع كل النسخ ونشرها في GitHub Releases
  release:
    name: Publish All Releases
    needs: [build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            desktop-*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
