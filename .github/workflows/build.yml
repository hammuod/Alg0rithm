name: Build Cross-Platform Apps (Desktop & Mobile)

on:
  workflow_dispatch:
  push:
    tags:
      - 'build*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build All Platform Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Web App Files
        run: |
          mkdir -p dist_app
          # نقل وتجهيز كافة ملفات المشروع بدون مجلدات جيت
          rsync -av --progress . dist_app/ --exclude .git --exclude .github --exclude dist_app
          
      - name: Build Universal Packages
        run: |
          # 1. حزمة Linux الموحدة (x86_64 / ARM / 32-bit / All Distros)
          tar -czvf alg0rithm-linux-universal.tar.gz -C dist_app .

          # 2. حزمة الجوال / الويب الموحدة (Universal Web App / PWA Zip)
          zip -r alg0rithm-mobile-pwa.zip dist_app/

      - name: Upload Everything to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            alg0rithm-linux-universal.tar.gz
            alg0rithm-mobile-pwa.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
