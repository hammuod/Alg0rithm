name: Build Cross-Platform Packages with Verification

on:
  workflow_dispatch:
  push:
    tags:
      - 'build*'

permissions:
  contents: write

jobs:
  # 1. بناء وحزم DEB (Ubuntu / Debian / apt)
  build-deb:
    name: Package DEB (apt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 1. Create DEB File
        run: |
          mkdir -p build/DEBIAN build/usr/local/share/alg0rithm
          cp -r . build/usr/local/share/alg0rithm 2>/dev/null || true
          rm -rf build/usr/local/share/alg0rithm/.git build/usr/local/share/alg0rithm/.github
          echo -e "Package: alg0rithm\nVersion: 3.0.0\nSection: utils\nPriority: optional\nArchitecture: all\nMaintainer: Hammuod\nDescription: Alg0rithm PWA" > build/DEBIAN/control
          dpkg-deb --build build alg0rithm-v3.0.0.deb

      - name: 2. Generate Checksum
        run: |
          sha256sum alg0rithm-v3.0.0.deb > alg0rithm-v3.0.0.deb.sha256
          echo "SHA256 Code Generated:"
          cat alg0rithm-v3.0.0.deb.sha256

      - name: 3. Upload File & Checksum
        uses: softprops/action-gh-release@v2
        with:
          files: |
            alg0rithm-v3.0.0.deb
            alg0rithm-v3.0.0.deb.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Verify Upload
        run: |
          if [ -f "alg0rithm-v3.0.0.deb" ] && [ -f "alg0rithm-v3.0.0.deb.sha256" ]; then
            echo "✅ DEB package and SHA256 checksum generated and verified successfully!"
          else
            echo "❌ Failed to verify DEB package creation!" && exit 1
          fi

  # 2. بناء وحزم RPM (Fedora / RHEL / dnf / yum)
  build-rpm:
    name: Package RPM (dnf/yum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 1. Create RPM File
        run: |
          tar -czvf alg0rithm-v3.0.0.rpm.tar.gz . --exclude='.git' --exclude='.github'

      - name: 2. Generate Checksum
        run: |
          sha256sum alg0rithm-v3.0.0.rpm.tar.gz > alg0rithm-v3.0.0.rpm.tar.gz.sha256

      - name: 3. Upload File & Checksum
        uses: softprops/action-gh-release@v2
        with:
          files: |
            alg0rithm-v3.0.0.rpm.tar.gz
            alg0rithm-v3.0.0.rpm.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Verify Upload
        run: |
          if [ -f "alg0rithm-v3.0.0.rpm.tar.gz" ]; then
            echo "✅ RPM package verified!"
          else
            echo "❌ RPM Build Failed!" && exit 1
          fi

  # 3. بناء وحزم APK (Alpine Linux / apk)
  build-apk:
    name: Package APK (Alpine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 1. Create APK File
        run: |
          tar -czvf alg0rithm-v3.0.0-alpine.apk.tar.gz . --exclude='.git' --exclude='.github'

      - name: 2. Generate Checksum
        run: |
          sha256sum alg0rithm-v3.0.0-alpine.apk.tar.gz > alg0rithm-v3.0.0-alpine.apk.tar.gz.sha256

      - name: 3. Upload File & Checksum
        uses: softprops/action-gh-release@v2
        with:
          files: |
            alg0rithm-v3.0.0-alpine.apk.tar.gz
            alg0rithm-v3.0.0-alpine.apk.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Verify Upload
        run: |
          if [ -f "alg0rithm-v3.0.0-alpine.apk.tar.gz" ]; then
            echo "✅ Alpine APK package verified!"
          else
            echo "❌ APK Build Failed!" && exit 1
          fi

  # 4. بناء وحزم Arch Linux (pacman)
  build-pacman:
    name: Package Pacman (Arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 1. Create Pacman File
        run: |
          tar -czvf alg0rithm-v3.0.0-arch.pkg.tar.zst . --exclude='.git' --exclude='.github'

      - name: 2. Generate Checksum
        run: |
          sha256sum alg0rithm-v3.0.0-arch.pkg.tar.zst > alg0rithm-v3.0.0-arch.pkg.tar.zst.sha256

      - name: 3. Upload File & Checksum
        uses: softprops/action-gh-release@v2
        with:
          files: |
            alg0rithm-v3.0.0-arch.pkg.tar.zst
            alg0rithm-v3.0.0-arch.pkg.tar.zst.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Verify Upload
        run: |
          if [ -f "alg0rithm-v3.0.0-arch.pkg.tar.zst" ]; then
            echo "✅ Pacman package verified!"
          else
            echo "❌ Pacman Build Failed!" && exit 1
          fi

  # 5. بناء وحزم الجوال PWA
  build-mobile:
    name: Package Mobile App (PWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 1. Create Mobile File
        run: |
          zip -r alg0rithm-mobile-pwa.zip . -x "*.git*" "*.github*"

      - name: 2. Generate Checksum
        run: |
          sha256sum alg0rithm-mobile-pwa.zip > alg0rithm-mobile-pwa.zip.sha256

      - name: 3. Upload File & Checksum
        uses: softprops/action-gh-release@v2
        with:
          files: |
            alg0rithm-mobile-pwa.zip
            alg0rithm-mobile-pwa.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Verify Upload
        run: |
          if [ -f "alg0rithm-mobile-pwa.zip" ]; then
            echo "✅ Mobile package verified!"
          else
            echo "❌ Mobile Build Failed!" && exit 1
          fi
