name: AppImage
on:
  workflow_dispatch:
  push:
    tags: ['build*']
permissions:
  contents: write
jobs:
  build:
    name: Build AppImage (Tauri)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Linux deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Tauri AppImage
        run: |
          chmod +x scripts/prepare-app.sh
          ./scripts/prepare-app.sh
          cd desktop && npm install --no-fund --no-audit
          npx tauri build --bundles appimage
      - name: Collect
        run: |
          mkdir -p dist
          find desktop/src-tauri/target/release/bundle -type f -name '*.AppImage' -exec cp {} dist/ \;
          ls -lh dist || true
      - uses: actions/upload-artifact@v4
        with:
          name: package-appimage
          path: dist/*
          if-no-files-found: warn
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'build' }}
          name: Alg0rithm packages
          body: |
            Native **Tauri** desktop app (not a browser tab).
          files: dist/*
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
