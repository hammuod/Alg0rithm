name: macOS
on:
  workflow_dispatch:
  push:
    tags: ['build*']
permissions:
  contents: write
jobs:
  build:
    name: Build macOS (Tauri)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Tauri macOS
        run: |
          chmod +x scripts/prepare-app.sh
          ./scripts/prepare-app.sh
          cd desktop && npm install --no-fund --no-audit
          npx tauri build --bundles app,dmg
      - name: Collect
        run: |
          mkdir -p dist
          find desktop/src-tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*.app' \) -exec cp {} dist/ \; 2>/dev/null || true
          # zip .app if present as directory
          find desktop/src-tauri/target/release/bundle -type d -name 'Alg0rithm.app' | while read d; do
            (cd "$(dirname "$d")" && zip -r "$GITHUB_WORKSPACE/dist/Alg0rithm-macos.app.zip" "$(basename "$d")")
          done
          ls -lh dist || true
      - uses: actions/upload-artifact@v4
        with:
          name: package-macos
          path: dist/*
          if-no-files-found: warn
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'build' }}
          name: Alg0rithm packages
          body: |
            Native **Tauri** desktop app (not a browser tab).
          files: dist/*
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
