name: macOS
on:
  workflow_dispatch:
  push:
    tags: ['build*']
permissions:
  contents: write
jobs:
  build:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/build-macos.sh && ./scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: package-macos
          path: dist/*
          if-no-files-found: warn
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'build' }}
          name: Packages (${{ github.ref_type == 'tag' && github.ref_name || 'build' }})
          files: dist/*
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
