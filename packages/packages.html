<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <meta name="description" content="Alg0rithm package repository and software libraries. Download the official packages and tools.">
  <title>Packages | Alg0rithm</title>
  <link rel="canonical" href="https://packages.alg0rithm.dev/" />
  <link rel="icon" href="/imgs/tap.ico">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/i18n.css">
  <link rel="stylesheet" href="/libs/fontawesome/css/all.min.css">
  <link rel="preload" href="/i18n/en.json" as="fetch" crossorigin="same-origin">
  <script src="/js/i18n.js"></script>
  <script>
    // The subdomain reaches this page through a redirect; keep the clean
    // subdomain root in the address bar (canonical URL).
    if (/^\/(packages\/packages|builds\/bulids)\/?$/.test(location.pathname)) {
      history.replaceState(null, '', '/');
    }
  </script>
  <style>
    .lang-switch, .i18n-veil { --bg-light: #161b22; --bg-card: #1c2128; --text: #e6edf3; --text-gray: #8b949e; --border: #30363d; }
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 40px 30px;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .icon {
      font-size: 3rem;
      color: #58a6ff;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 12px;
      color: #f0f6fc;
    }
    p {
      color: #8b949e;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 25px;
    }
    .btn {
      display: inline-block;
      background-color: #238636;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover {
      background-color: #2ea043;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">
      <i class="fa-solid fa-boxes-packing"></i>
    </div>
    <h1 data-i18n="packages.title">Package Repository</h1>
    <p data-i18n="packages.body">Alg0rithm package repository and software libraries are currently under construction. They will be available for download in the upcoming release.</p>
    <a href="https://alg0rithm.dev/" class="btn" data-i18n="packages.back">Back to Main Site</a>
  </div>


</body>
</html>
