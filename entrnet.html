<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css"/>
    <link rel="stylesheet" href="css/net.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" href="imgs/tap.ico">
    <meta property="og:image" content="imgs/icon.png">
    <meta property="og:image:width" content="500">
    <meta property="og:image:height" content="500">
    <link rel="stylesheet" href="css/global.css">
    <link rel="canonical" href="https://alg0rithm.dev/" />
    <title>Alg0rithm | no net </title>
</head>
<body>
    <button class="dark-mode-toggle" id="dark-mode-toggle" aria-label="Toggle Dark Mode">
        <i class="fa-solid fa-moon"></i>
        <i class="fa-solid fa-sun"></i>
    </button>

    <div class="network-card">
        <!-- حالة عدم وجود إنترنت -->
        <div class="net-status nonet hide">
            <div class="net-icon offline">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="title">No Internet Connection</h3>
            <p class="desc">Please check your network cables or Wi-Fi connection and try again.</p>
        </div>

        <!-- حالة عودة الإنترنت -->
        <div class="net-status yesnet hide">
            <div class="net-icon online">
                <i class="fa-solid fa-wifi"></i>
            </div>
            <h3 class="title">You are back online!</h3>
            <p class="desc">Your internet connection has been restored.</p>
            <button class="btn-action" onclick="window.location.reload()">Reload Page</button>
        </div>
    </div>

    <script src="js/net.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js').then(() => {
            console.log('Service Worker registered');
          }).catch((err) => console.log('SW registration failed:', err));
        }
    </script>
</body>
</html>
