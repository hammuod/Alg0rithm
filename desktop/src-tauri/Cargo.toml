[package]
name = "alg0rithm"
version = "3.0.0"
description = "Alg0rithm — learn algorithms (native desktop app)"
authors = ["Hammoud"]
edition = "2021"

[lib]
name = "alg0rithm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
